<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1523" />
<!--
  Content Security Policy. connect-src is what limits where this page can send
  your data. It currently allows any *.workers.dev host; tighten it to your own
  Worker for the strongest setting, e.g.
    connect-src https://fifa-series-counter.rajpal-prateek98.workers.dev;
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src data: blob:;
  connect-src https://*.workers.dev;
  form-action 'none';
  base-uri 'none';
" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>FC 26 series log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B1523;
    --panel: #132038;
    --panel2: #1B2C49;
    --line: #27395B;
    --chalk: #EEF2F7;
    --muted: #7E93B4;
    --dim: #4E6486;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body {
    font-family: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--chalk);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-size: 40px; font-weight: 700; line-height: .95; margin: 0;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .p16 { padding: 16px; }
  .num { font-family: "Barlow Condensed", Barlow, sans-serif; font-weight: 700; line-height: 1; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
  input { font-family: inherit; outline: none; }

  nav { display: flex; gap: 2px; background: var(--panel); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
  nav button { flex: 1; border-radius: 10px; padding: 9px 2px; font-size: 13px; font-weight: 600;
                color: var(--muted); white-space: nowrap; }
  nav button.on { background: var(--panel2); color: var(--chalk); }

  .btn { border-radius: 12px; padding: 13px 16px; font-size: 14px; font-weight: 600; }
  .btn.go { background: var(--chalk); color: var(--ink); }
  .btn.quiet { border: 1px solid var(--line); color: var(--chalk); }
  .btn[disabled] { opacity: .4; }
  .full { width: 100%; display: block; }

  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; align-items: baseline; justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .stack8 { display: flex; flex-direction: column; gap: 8px; }

  .slot { display: flex; align-items: center; width: 100%; padding: 12px; border-radius: 12px;
          background: var(--panel2); border: 1px solid var(--line); text-align: left; }
  .slot.empty { background: none; border: 1px dashed var(--line); color: var(--dim); font-size: 14px; }
  .slot .idx { width: 22px; font-size: 13px; font-weight: 700; color: var(--dim); flex: none; }
  .slot .side { flex: 1; font-size: 14px; overflow: hidden; }
  .slot .score { font-family: "Barlow Condensed", Barlow, sans-serif; font-size: 24px; font-weight: 700; padding: 0 8px; }

  .bar { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; }

  .chip { border-radius: 12px; padding: 9px 15px; font-size: 14px; font-weight: 600;
          border: 1px solid var(--line); color: var(--chalk); }
  .step { width: 40px; height: 40px; border-radius: 99px; background: var(--panel2);
          border: 1px solid var(--line); color: var(--chalk); font-size: 20px; line-height: 1;
          display: flex; align-items: center; justify-content: center; flex: none; }
  .goals { min-width: 52px; text-align: center; font-size: 46px; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; font-weight: 600; color: var(--dim); padding-bottom: 8px; text-align: right; }
  th:first-child { text-align: left; }
  td { font-size: 14px; padding: 8px 0; text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { text-align: left; font-weight: 700; }
  tbody tr { border-top: 1px solid var(--line); }
  th + th, td + td { padding-left: 12px; }

  .name-in { flex: 1; border-radius: 12px; padding: 10px 12px; background: var(--panel2);
             border: 1px solid var(--line); color: var(--chalk); font-size: 15px; }
  .date-in { border-radius: 10px; padding: 7px 10px; background: var(--panel2);
             border: 1px solid var(--line); color: var(--chalk); font-size: 13px;
             font-family: inherit; }
  .sc-in { width: 100%; border-radius: 10px; padding: 8px 10px; background: var(--panel2);
           border: 1px solid var(--line); color: var(--chalk); font-size: 13px; }
  .scorers { display: block; font-size: 11px; font-weight: 500; color: var(--muted);
             margin-top: 3px; line-height: 1.35; }
  .cnt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
         font-weight: 600; margin-left: 8px; }
  .cnt i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; font-style: normal; }
  .pill { width: 22px; height: 22px; border-radius: 999px; display: inline-flex;
          align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .carry-in { width: 76px; text-align: center; border-radius: 12px; padding: 10px 8px;
              background: var(--panel2); border: 1px solid var(--line); color: var(--chalk);
              font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sel { width: 100%; border-radius: 12px; padding: 10px 12px; background: var(--panel2);
         border: 1px solid var(--line); color: var(--chalk); font-size: 14px;
         font-family: inherit; -webkit-appearance: none; appearance: none; }
  .team { display: block; font-size: 11px; font-weight: 500; color: var(--dim);
          margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tchip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px;
           padding: 7px 8px 7px 14px; font-size: 13px; font-weight: 500;
           background: var(--panel2); border: 1px solid var(--line); }
  .tchip span[data-delteam] { color: var(--dim); font-size: 16px; line-height: 1; padding: 0 4px; }
  .dot { width: 10px; height: 10px; border-radius: 99px; flex: none; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .tiny { color: var(--dim); font-size: 12px; }
  .warn { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
          padding: 10px 12px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>FC 26 series log</h1>
  <p class="sub">Five matches a series. Most wins takes it. Level is a draw.</p>
  <div id="warn"></div>
  <div id="syncbar"></div>
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "fc26:log:v1";

  // Optional. Fill these in and everyone who opens the page is set up with no
  // link needed. WARNING: this file is public on GitHub, so anything you put
  // in DEFAULT_ROOM is public too — anyone could read and overwrite the log.
  // Leave DEFAULT_ROOM empty and share an invite link instead (Setup screen).
  var DEFAULT_URL = "";
  var DEFAULT_ROOM = "";
  var KITS = ["#FFB627", "#3FD6C4", "#FF5E7A"];
  var DEFAULT = {
    seriesLength: 5,
    carry: { a: 0, b: 0, c: 0 },
    carryH2H: {},
    versions: ["FC 26", "FC 27"],
    lastVersion: "FC 26",
    sync: { url: "", room: "" },
    pushedAt: 0,
    teams: ["Liverpool", "Barcelona", "Real Madrid", "Bayern Munich",
            "Manchester City", "Arsenal", "PSG", "Inter Milan"],
    players: [
      { id: "a", name: "Player 1" },
      { id: "b", name: "Player 2" },
      { id: "c", name: "Player 3" }
    ],
    series: []
  };

  var storageOK = true;
  var data = load();
  var ui = { pair: 0, ver: "", day: "", player: "", tab: "now", sheet: null, picked: [], ga: 0, gb: 0, ta: "", tb: "", sa: [], sb: [], v: "",
             newTeam: "", newVer: "", invited: false, inviteText: "", openSeries: null, confirming: false, copied: false };

  /* ------------------------------ persistence ----------------------------- */

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(Object.assign({}, DEFAULT, JSON.parse(raw)));
    } catch (e) { storageOK = false; }
    return JSON.parse(JSON.stringify(DEFAULT));
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      storageOK = true;
    } catch (e) { storageOK = false; }
  }

  /* -------------------------------- helpers ------------------------------- */

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function idx(id) { for (var i = 0; i < data.players.length; i++) if (data.players[i].id === id) return i; return 0; }
  function kit(id) { return KITS[idx(id) % 3]; }
  function nameOf(id) { var p = data.players[idx(id)]; return p ? p.name : "?"; }

  // Deleted records stick around as tombstones so a delete on one phone
  // doesn't get resurrected by another phone that hadn't synced yet.
  function mx(s) {
    return (s.matches || []).filter(function (m) { return !m.deleted; })
      .sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  }
  // Version filter. Only the Table and History tabs honour it; logging is
  // always against the live series whatever the filter says.
  function verOK(m) { return !ui.ver || (m.v || "") === ui.ver; }
  function mxv(s) { return mx(s).filter(verOK); }
  function sxv() {
    return sx().filter(function (s) { return !ui.ver || mx(s).some(verOK); });
  }

  // A series keeps its real number whatever the version filter is showing.
  function seriesNo(s) { return sx().indexOf(s) + 1; }

  function sx() {
    return (data.series || []).filter(function (s) { return !s.deleted; })
      .sort(function (a, b) {
        // Date played comes first so a backdated series lands in the right
        // place; created time only breaks ties within the same day.
        var da = a.date || "", db = b.date || "";
        if (da !== db) return da < db ? -1 : 1;
        return (a.created || 0) - (b.created || 0);
      });
  }

  // Bring older saves, and anything pulled down, up to the synced shape.
  function normalize(d) {
    if (!d.series) d.series = [];
    var base = Date.now() - d.series.length * 1000;
    d.series.forEach(function (s, si) {
      if (!s.id) s.id = uid();
      if (!s.created) s.created = base + si * 1000;
      if (!s.updated) s.updated = s.created;
      if (!s.date) s.date = ymd(s.created);
      if (!s.deleted) s.deleted = 0;
      if (!s.matches) s.matches = [];
      s.matches.forEach(function (m, mi) {
        if (!m.id) m.id = uid();
        if (m.ord == null) m.ord = mi;
        if (!Array.isArray(m.sc)) m.sc = [];
        if (!m.updated) m.updated = s.created + mi;
        if (!m.deleted) m.deleted = 0;
      });
    });
    if (!d.sync) d.sync = { url: "", room: "" };
    if (!d.sync.url && DEFAULT_URL) d.sync.url = DEFAULT_URL;
    if (!d.sync.room && DEFAULT_ROOM) d.sync.room = DEFAULT_ROOM;
    if (!d.versions || !d.versions.length) d.versions = ["FC 26", "FC 27"];
    if (!d.carryH2H) d.carryH2H = {};
    return d;
  }

  function tally(matches) {
    var t = {};
    data.players.forEach(function (p) { t[p.id] = { w: 0, d: 0, l: 0, gf: 0, ga: 0, p: 0 }; });
    matches.forEach(function (m) {
      if (!t[m.a] || !t[m.b]) return;
      t[m.a].p++; t[m.b].p++;
      t[m.a].gf += m.ga; t[m.a].ga += m.gb;
      t[m.b].gf += m.gb; t[m.b].ga += m.ga;
      // A drawn match counts for neither side. No points, nothing deducted.
      if (m.ga > m.gb) { t[m.a].w++; t[m.b].l++; }
      else if (m.gb > m.ga) { t[m.b].w++; t[m.a].l++; }
      else { t[m.a].d++; t[m.b].d++; }
    });
    Object.keys(t).forEach(function (k) { t[k].gd = t[k].gf - t[k].ga; });
    return t;
  }

  function seriesResult(s) {
    var t = tally(mx(s));
    var ranked = data.players.map(function (p) {
      return Object.assign({ id: p.id }, t[p.id]);
    }).filter(function (r) { return r.p > 0; })
      .sort(function (x, y) { return y.w - x.w || y.gd - x.gd || y.gf - x.gf; });
    var played = mx(s).length;
    var left = Math.max(0, data.seriesLength - played);

    if (!ranked.length) {
      return { complete: false, winner: null, shared: [], table: [],
               left: left, clinched: false, played: played };
    }

    var top = ranked[0];
    var chaser = ranked[1] ? ranked[1].w : 0;
    // Decided as soon as the best anyone else can still reach falls short of
    // the leader. Win the first three of five and the last two aren't played.
    var clinched = top.w > chaser + left;
    var complete = played > 0 && (left === 0 || clinched);

    // Match wins decide a series and nothing else. Level on wins is a draw.
    var tied = ranked.filter(function (r) { return r.w === top.w; });
    return {
      complete: complete,
      clinched: clinched,
      left: left,
      played: played,
      winner: tied.length === 1 ? top.id : null,
      shared: tied.length > 1 ? tied.map(function (r) { return r.id; }) : [],
      table: ranked
    };
  }

  function ymd(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function prettyDate(s) {
    if (!s) return "";
    var b = String(s).split("-");
    if (b.length !== 3) return s;
    return Number(b[2]) + " " + (MONTHS[Number(b[1]) - 1] || "") + " " + b[0];
  }

  function pairKey(x, y) { return [x, y].sort().join("|"); }

  // Old series won against one specific opponent, from x's side.
  function carryPair(x, y) {
    var o = (data.carryH2H || {})[pairKey(x, y)] || {};
    return { x: Number(o[x]) || 0, y: Number(o[y]) || 0 };
  }

  // Series carried over but never attributed to an opponent.
  function carryLoose(id) { return (data.carry && Number(data.carry[id])) || 0; }

  // Everything a player won before the app started, however it was entered.
  function carryOf(id) {
    var n = carryLoose(id);
    data.players.forEach(function (p) {
      if (p.id !== id) n += carryPair(id, p.id).x;
    });
    return n;
  }

  function carryTotal() {
    return data.players.reduce(function (n, p) { return n + carryOf(p.id); }, 0);
  }

  function seasonTable() {
    var all = [];
    sxv().forEach(function (s) { all = all.concat(mxv(s)); });
    var t = tally(all);
    var won = {}, shared = {};
    data.players.forEach(function (p) { won[p.id] = carryOf(p.id); shared[p.id] = 0; });
    sxv().forEach(function (s) {
      var r = seriesResult(s);
      if (!r.complete) return;
      if (r.winner) won[r.winner]++;
      else r.shared.forEach(function (id) { shared[id]++; });
    });
    return data.players.map(function (p, i) {
      return Object.assign({ id: p.id, name: p.name, kit: KITS[i % 3], won: won[p.id], shared: shared[p.id] }, t[p.id]);
    }).sort(function (x, y) { return y.won - x.won || y.w - x.w || y.gd - x.gd; });
  }

  /* -------------------------------- rendering ----------------------------- */

  function knownScorers() {
    var seen = {}, out = [];
    sx().forEach(function (s) {
      mx(s).forEach(function (m) {
        (m.sc || []).forEach(function (g) {
          var n = (g.n || "").trim();
          if (!n || seen[n.toLowerCase()]) return;
          seen[n.toLowerCase()] = 1;
          out.push(n);
        });
      });
    });
    return out.sort();
  }

  function scorerInputs(side) {
    var goals = side === 0 ? ui.ga : ui.gb;
    var arr = side === 0 ? ui.sa : ui.sb;
    if (!goals) return "";
    var out = "";
    for (var i = 0; i < goals; i++) {
      out += '<input class="sc-in" list="scorerlist" data-scorer="' + side + ":" + i +
        '" placeholder="Goal ' + (i + 1) + '" value="' + esc(arr[i] || "") + '" />';
    }
    return '<div class="stack8" style="margin-top:10px">' + out + "</div>";
  }

  function versionSelect(current) {
    var list = (data.versions || []).slice();
    if (current && list.indexOf(current) < 0) list.unshift(current);
    return '<select class="sel" data-ver="1">' +
      list.map(function (v) {
        return '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>";
      }).join("") + "</select>";
  }

  function teamSelect(side, current) {
    var list = data.teams.slice();
    // A team used in an old match but since deleted still needs to show.
    if (current && list.indexOf(current) < 0) list.unshift(current);
    var opts = '<option value="">Pick a team</option>' + list.map(function (t) {
      return '<option value="' + esc(t) + '"' + (t === current ? " selected" : "") + ">" + esc(t) + "</option>";
    }).join("");
    return '<select class="sel" data-team="' + side + '">' + opts + "</select>";
  }

  // Matches in the order they were played, across every series.
  function chronological() {
    var out = [];
    sxv().forEach(function (s, si) {
      mxv(s).forEach(function (m) { out.push({ m: m, s: s, num: seriesNo(s) }); });
    });
    return out;
  }

  function records() {
    var flat = chronological();
    var r = { biggest: null, highest: null, streak: null, seriesGoals: null,
              bestSeries: null, night: null };

    flat.forEach(function (e) {
      var m = e.m, margin = Math.abs(m.ga - m.gb), total = m.ga + m.gb;
      if (margin > 0 && (!r.biggest || margin > r.biggest.margin)) {
        r.biggest = { margin: margin, e: e,
          winner: m.ga > m.gb ? m.a : m.b, loser: m.ga > m.gb ? m.b : m.a,
          hi: Math.max(m.ga, m.gb), lo: Math.min(m.ga, m.gb) };
      }
      if (!r.highest || total > r.highest.total) r.highest = { total: total, e: e };
    });

    // Longest run of match wins by one player, in order played.
    var cur = null, best = null;
    flat.forEach(function (e) {
      var m = e.m;
      var w = m.ga > m.gb ? m.a : m.gb > m.ga ? m.b : null;
      if (w && cur && cur.id === w) cur.n++;
      else cur = w ? { id: w, n: 1 } : null;
      if (cur && (!best || cur.n > best.n)) best = { id: cur.id, n: cur.n };
    });
    if (best && best.n > 1) r.streak = best;

    // Most goals by one player inside a single series, and best points haul.
    sxv().forEach(function (s, si) {
      var t = tally(mxv(s));
      data.players.forEach(function (p) {
        var row = t[p.id];
        if (!row || !row.p) return;
        if (!r.seriesGoals || row.gf > r.seriesGoals.goals) {
          r.seriesGoals = { id: p.id, goals: row.gf, num: seriesNo(s), date: s.date };
        }
        if (!r.bestSeries || row.w > r.bestSeries.w) {
          r.bestSeries = { id: p.id, w: row.w, num: seriesNo(s), date: s.date };
        }
      });
    });

    // Most series won by one player on a single night.
    groupByNight(sxv()).forEach(function (g) {
      var nr = nightResult(g.list);
      var top = nr.ranked[0];
      if (!top || !top.n) return;
      if (!r.night || top.n > r.night.n) {
        r.night = { id: top.id, n: top.n, of: g.list.length, date: g.date };
      }
    });
    return r;
  }

  function recordsHTML() {
    var r = records();
    if (!r.biggest && !r.highest) {
      return '<div class="panel p16">' +
        '<div style="font-size:15px;font-weight:600;margin-bottom:12px">Records</div>' +
        '<div class="note">Log a few matches and the records fill in.</div></div>';
    }

    function row(label, value, colour, sub) {
      return '<div style="padding:12px 0;border-top:1px solid var(--line)">' +
        '<div class="between">' +
          '<span class="note">' + label + "</span>" +
          '<span style="font-size:15px;font-weight:700;text-align:right;color:' + (colour || "var(--chalk)") + '">' +
            value + "</span>" +
        "</div>" +
        (sub ? '<div class="tiny" style="text-align:right;margin-top:2px">' + sub + "</div>" : "") +
      "</div>";
    }

    var out = "";
    if (r.biggest) {
      out += row("Biggest win",
        esc(nameOf(r.biggest.winner)) + " " + r.biggest.hi + "\u2013" + r.biggest.lo + " " + esc(nameOf(r.biggest.loser)),
        kit(r.biggest.winner),
        "Series " + r.biggest.e.num + (r.biggest.e.s.date ? " \u00b7 " + esc(prettyDate(r.biggest.e.s.date)) : ""));
    }
    if (r.highest) {
      var hm = r.highest.e.m;
      out += row("Highest scoring match",
        esc(nameOf(hm.a)) + " " + hm.ga + "\u2013" + hm.gb + " " + esc(nameOf(hm.b)),
        "var(--chalk)",

        esc(nameOf(r.streak.id)));

        esc(nameOf(r.seriesGoals.id)) + " \u00b7 series " + r.seriesGoals.num);
    }
    if (r.night) {
      out += row("Best night", r.night.n + " of " + r.night.of + " series", kit(r.night.id),
        esc(nameOf(r.night.id)) + " \u00b7 " + esc(prettyDate(r.night.date)));

        esc(nameOf(r.bestSeries.id)) + " \u00b7 series " + r.bestSeries.num);
    }

    return '<div class="panel p16">' +
      '<div style="font-size:15px;font-weight:600">Records</div>' + out + "</div>";
  }

  function scorerTable() {
    var t = {};
    sxv().forEach(function (s) {
      mxv(s).forEach(function (m) {
        (m.sc || []).forEach(function (g) {
          var n = (g.n || "").trim();
          if (!n) return;
          var key = n.toLowerCase();
          if (!t[key]) t[key] = { name: n, goals: 0, by: {} };
          t[key].goals++;
          var owner = g.s === "a" ? m.a : m.b;
          t[key].by[owner] = (t[key].by[owner] || 0) + 1;
        });
      });
    });
    return Object.keys(t).map(function (k) { return t[k]; })
      .sort(function (x, y) { return y.goals - x.goals || x.name.localeCompare(y.name); });
  }

  // Which club has faced which, across every match. Keyed on the pair of
  // teams, so it doesn't matter who was controlling them.
  function rivalryTable() {
    var map = {}, sameTeam = 0, keys = [];
    sxv().forEach(function (s) {
      mxv(s).forEach(function (m) {
        var A = (m.ta || "").trim(), B = (m.tb || "").trim();
        if (!A || !B) return;
        if (A === B) { sameTeam++; return; }
        var pair = [A, B].sort();
        var key = pair.join("\u0000");
        var r = map[key];
        if (!r) {
          r = map[key] = { x: pair[0], y: pair[1], n: 0, wx: 0, wy: 0, d: 0,
                           gx: 0, gy: 0, best: null, last: null };
          keys.push(key);
        }
        var xIsHome = r.x === A;
        var gx = xIsHome ? m.ga : m.gb;
        var gy = xIsHome ? m.gb : m.ga;
        r.n++; r.gx += gx; r.gy += gy;
        if (gx > gy) r.wx++; else if (gy > gx) r.wy++; else r.d++;
        var margin = Math.abs(gx - gy);
        if (margin && (!r.best || margin > r.best.margin)) {
          r.best = { margin: margin, team: gx > gy ? r.x : r.y,
                     hi: Math.max(gx, gy), lo: Math.min(gx, gy) };
        }
        r.last = { gx: gx, gy: gy, date: s.date }; // series are in date order
      });
    });
    return {
      list: keys.map(function (k) { return map[k]; })
        .sort(function (a, b) { return b.n - a.n || (b.gx + b.gy) - (a.gx + a.gy); }),
      sameTeam: sameTeam
    };
  }

    }

    var rows = rv.list.slice(0, 8).map(function (r) {

        "</div>" +
        '<div class="tiny" style="margin-top:3px">goals ' + r.gx + "\u2013" + r.gy +
          (r.best ? " \u00b7 biggest " + esc(r.best.team) + " " + r.best.hi + "\u2013" + r.best.lo : "") +
          (r.last ? " \u00b7 last " + r.last.gx + "\u2013" + r.last.gy +

    return '<div class="panel p16">' +

      '<div class="tiny" style="margin-bottom:2px">' + lead + "</div>" +
      rows +
      (rv.sameTeam ? '<div class="tiny" style="margin-top:12px">' + rv.sameTeam +
        (rv.sameTeam === 1 ? " match was" : " matches were") +
        " the same team on both sides and isn\u2019t counted here.</div>" : "") +
      "</div>";
  }

  function teamTable() {
    var t = {};
    sxv().forEach(function (s) {
      mxv(s).forEach(function (m) {
        [[m.ta, m.ga, m.gb], [m.tb, m.gb, m.ga]].forEach(function (x) {
          if (!x[0]) return;
          if (!t[x[0]]) t[x[0]] = { name: x[0], p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
          var r = t[x[0]];
          r.p++; r.gf += x[1]; r.ga += x[2];
          if (x[1] > x[2]) r.w++; else if (x[1] < x[2]) r.l++; else r.d++;
        });
      });
    });
    return Object.keys(t).map(function (k) { return t[k]; })
      .sort(function (x, y) { return y.p - x.p || y.w - x.w; });
  }

  function pairList() {
    var out = [];
    for (var i = 0; i < data.players.length; i++)
      for (var j = i + 1; j < data.players.length; j++)
        out.push([data.players[i].id, data.players[j].id]);
    return out;
  }

  // Everything about x vs y, told from x's side.
  function h2h(x, y) {
    var met = [];
    sxv().forEach(function (s, si) {
      mxv(s).forEach(function (m) {
        if ((m.a === x && m.b === y) || (m.a === y && m.b === x)) {
          var flip = m.a === y;
          met.push({
            series: seriesNo(s),
            gx: flip ? m.gb : m.ga,
            gy: flip ? m.ga : m.gb,
            tx: flip ? m.tb : m.ta,
            ty: flip ? m.ta : m.tb
          });
        }
      });
    });

    var r = { met: met, p: met.length, wx: 0, wy: 0, d: 0, gx: 0, gy: 0, best: null, streak: null };
    met.forEach(function (m) {
      r.gx += m.gx; r.gy += m.gy;
      if (m.gx > m.gy) r.wx++; else if (m.gy > m.gx) r.wy++; else r.d++;
    });

    // Biggest winning margin either way.
    met.forEach(function (m) {
      var margin = Math.abs(m.gx - m.gy);
      if (margin === 0) return;
      if (!r.best || margin > r.best.margin) {
        r.best = { margin: margin, winner: m.gx > m.gy ? x : y, hi: Math.max(m.gx, m.gy), lo: Math.min(m.gx, m.gy) };
      }
    });

    // Current run, counting back from the latest meeting.
    if (met.length) {
      var last = met[met.length - 1];
      var kind = last.gx > last.gy ? "x" : last.gx < last.gy ? "y" : "d";
      var n = 0;
      for (var i = met.length - 1; i >= 0; i--) {
        var m = met[i];
        var k = m.gx > m.gy ? "x" : m.gx < m.gy ? "y" : "d";
        if (k !== kind) break;
        n++;
      }
      r.streak = { kind: kind, n: n };
    }
    return r;
  }

  // Series that were purely between these two. A three-way series belongs to
  // no pair, so it is left out of the head-to-head series count.
  function pairSeries(x, y) {
    return sxv().filter(function (s) {
      var ms = mxv(s);
      if (!ms.length) return false;
      var seen = {};
      ms.forEach(function (m) { seen[m.a] = 1; seen[m.b] = 1; });
      var ids = Object.keys(seen);
      return ids.length === 2 && seen[x] && seen[y];
    });
  }

  function pairSeriesRecord(x, y) {
    var wx = 0, wy = 0, drawn = 0, open = 0, threeWay = 0;
    pairSeries(x, y).forEach(function (s) {
      var r = seriesResult(s);
      if (!r.complete) { open++; return; }
      if (r.winner === x) wx++;
      else if (r.winner === y) wy++;
      else drawn++;
    });
    sxv().forEach(function (s) {
      var ms = mxv(s);
      if (!ms.length) return;
      var seen = {};
      ms.forEach(function (m) { seen[m.a] = 1; seen[m.b] = 1; });
      if (Object.keys(seen).length > 2) threeWay++;
    });
    var cp = carryPair(x, y);
    return {
      wx: wx, wy: wy, drawn: drawn, open: open, threeWay: threeWay,
      carryX: cp.x, carryY: cp.y,
      totalX: wx + cp.x, totalY: wy + cp.y
    };
  }

  // Everything about one player, from their own side of every match.
  function playerStats(pid) {
    var rows = [];
    sxv().forEach(function (s) {
      mxv(s).forEach(function (m) {
        if (m.a !== pid && m.b !== pid) return;
        var home = m.a === pid;
        var side = home ? "a" : "b";
        rows.push({
          s: s, m: m,
          opp: home ? m.b : m.a,
          gf: home ? m.ga : m.gb,
          ga: home ? m.gb : m.ga,
          team: (home ? m.ta : m.tb) || "",
          oppTeam: (home ? m.tb : m.ta) || "",
          mine: (m.sc || []).filter(function (g) { return g.s === side; })
        });
      });
    });

    var st = {
      rows: rows, p: rows.length, w: 0, d: 0, l: 0, gf: 0, ga: 0,
      clean: 0, blank: 0, teams: {}, scorers: {}, opp: {},
      best: null, streak: 0, seriesWon: 0, seriesDrawn: 0, seriesLost: 0, seriesPlayed: 0
    };

    var run = 0;
    rows.forEach(function (r) {
      st.gf += r.gf; st.ga += r.ga;
      var res = r.gf > r.ga ? "w" : r.gf < r.ga ? "l" : "d";
      st[res]++;
      if (r.ga === 0) st.clean++;
      if (r.gf === 0) st.blank++;

      run = res === "w" ? run + 1 : 0;
      if (run > st.streak) st.streak = run;

      if (res === "w" && (!st.best || r.gf - r.ga > st.best.gf - st.best.ga)) st.best = r;

      if (r.team) {
        var tk = st.teams[r.team] || (st.teams[r.team] = { name: r.team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
        tk.p++; tk[res]++; tk.gf += r.gf; tk.ga += r.ga;
      }
      r.mine.forEach(function (g) {
        var n = (g.n || "").trim();
        if (!n) return;
        var key = n.toLowerCase();
        var sc = st.scorers[key] || (st.scorers[key] = { name: n, goals: 0 });
        sc.goals++;
      });
      var ok = st.opp[r.opp] || (st.opp[r.opp] = { id: r.opp, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
      ok.p++; ok[res]++; ok.gf += r.gf; ok.ga += r.ga;
    });

    st.gd = st.gf - st.ga;

    // Series this player actually took part in.
    sxv().forEach(function (s) {
      var played = mxv(s).some(function (m) { return m.a === pid || m.b === pid; });
      if (!played) return;
      var r = seriesResult(s);
      if (!r.complete) return;
      st.seriesPlayed++;
      if (r.winner === pid) st.seriesWon++;
      else if (r.winner) st.seriesLost++;
      else st.seriesDrawn++;
    });
    st.seriesWon += carryOf(pid);

    var teamList = Object.keys(st.teams).map(function (k) { return st.teams[k]; });
    st.favTeam = teamList.slice().sort(function (a, b) { return b.p - a.p || b.w - a.w; })[0] || null;
    st.bestTeam = teamList.filter(function (t) { return t.p >= 3; })
      .sort(function (a, b) { return (b.w / b.p) - (a.w / a.p) || b.p - a.p; })[0] || null;
    if (st.bestTeam && st.favTeam && st.bestTeam.name === st.favTeam.name) st.bestTeam = null;
    st.teamList = teamList.sort(function (a, b) { return b.p - a.p; });

    st.scorerList = Object.keys(st.scorers).map(function (k) { return st.scorers[k]; })
      .sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });
    st.favScorer = st.scorerList[0] || null;

    st.oppList = Object.keys(st.opp).map(function (k) { return st.opp[k]; })
      .sort(function (a, b) { return b.p - a.p; });

    return st;
  }

  /* ---------------------------------- sync -------------------------------- */

  var sync = { state: "idle", msg: "", at: 0, timer: null };

  // An invite link carries the Worker address and room code in the fragment,
  // which browsers never send to the server. Applied once, then wiped from
  // the address bar so it isn't left sitting in history.
  function readInviteLink() {
    var hash = (location.hash || "").replace(/^#/, "");
    if (!hash) return false;
    var q;
    try { q = new URLSearchParams(hash); } catch (e) { return false; }
    var room = (q.get("room") || "").trim();
    var url = (q.get("s") || "").trim();
    if (!room && !url) return false;

    var changed = false;
    var already = data.sync.room;
    if (room && room !== already) {
      if (already && !window.confirm(
            "This link joins the room \"" + room + "\".\n\n" +
            "You're currently on \"" + already + "\". Switch?")) {
        wipeHash();
        return false;
      }
      data.sync.room = room;
      changed = true;
    }
    if (url && url !== data.sync.url) { data.sync.url = url; changed = true; }

    if (changed) { data.pushedAt = 0; save(); } // re-push everything into the room
    wipeHash();
    return changed;
  }

  function wipeHash() {
    try {
      history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {
      location.hash = "";
    }
  }

  function inviteLink() {
    if (!syncConfigured()) return "";
    return location.origin + location.pathname +
      "#room=" + encodeURIComponent(data.sync.room) +
      "&s=" + encodeURIComponent(data.sync.url);
  }

  function shareInvite() {
    var link = inviteLink();
    if (!link) return;
    if (navigator.share) {
      navigator.share({ title: "FC series log", text: "Join our log", url: link })
        .catch(function () { copyInvite(link); });
      return;
    }
    copyInvite(link);
  }

  function copyInvite(link) {
    function done() {
      ui.invited = true; ui.inviteText = ""; render();
      setTimeout(function () { ui.invited = false; render(); }, 1800);
    }
    // No clipboard on plain http, in older browsers, or when permission is
    // refused. Show the link instead so it can still be copied by hand.
    function fallback() { ui.inviteText = link; ui.invited = false; render(); }

    if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
    try {
      navigator.clipboard.writeText(link).then(done, fallback);
    } catch (e) { fallback(); }
  }

  function syncConfigured() {
    return !!(data.sync && data.sync.url && data.sync.room);
  }

  function endpoint(path) {
    var base = String(data.sync.url).replace(/\/+$/, "");
    return base + path;
  }

  // Flatten the nested store into rows the Worker understands.
  function outboundRows() {
    var since = data.pushedAt || 0;
    var series = [], matches = [];
    (data.series || []).forEach(function (s) {
      if ((s.updated || 0) > since) {
        series.push({ id: s.id, created: s.created, sdate: s.date || "",
                      updated: s.updated, deleted: s.deleted ? 1 : 0 });
      }
      (s.matches || []).forEach(function (m) {
        if ((m.updated || 0) <= since) return;
        matches.push({
          id: m.id, series_id: s.id, ord: m.ord || 0,
          pa: m.a, pb: m.b, ga: m.ga, gb: m.gb, ta: m.ta || "", tb: m.tb || "",
          sc: JSON.stringify(m.sc || []), v: m.v || "",
          updated: m.updated, deleted: m.deleted ? 1 : 0
        });
      });
    });
    return { series: series, matches: matches };
  }

  function settingsBlob() {
    return {
      json: JSON.stringify({
        players: data.players, teams: data.teams, versions: data.versions,
        seriesLength: data.seriesLength,
        carry: data.carry, carryH2H: data.carryH2H
      }),
      updated: data.settingsUpdated || 0
    };
  }

  // Newer wins, record by record. Never drops a row the other side has.
  function mergeDown(payload) {
    var byId = {};
    (data.series || []).forEach(function (s) { byId[s.id] = s; });

    (payload.series || []).forEach(function (row) {
      var local = byId[row.id];
      if (!local) {
        local = { id: row.id, created: row.created, date: row.sdate || ymd(row.created),
                  updated: row.updated, deleted: row.deleted ? 1 : 0, matches: [] };
        data.series.push(local);
        byId[row.id] = local;
      } else if ((row.updated || 0) > (local.updated || 0)) {
        local.created = row.created;
        local.date = row.sdate || local.date || ymd(row.created);
        local.updated = row.updated;
        local.deleted = row.deleted ? 1 : 0;
      }
    });

    (payload.matches || []).forEach(function (row) {
      var s = byId[row.series_id];
      if (!s) return; // its series hasn't arrived; next pull picks it up
      var local = null;
      for (var i = 0; i < s.matches.length; i++) if (s.matches[i].id === row.id) { local = s.matches[i]; break; }
      var next = {
        id: row.id, ord: row.ord, a: row.pa, b: row.pb,
        ga: row.ga, gb: row.gb, ta: row.ta || "", tb: row.tb || "",
        sc: parseSc(row.sc), v: row.v || "",
        updated: row.updated, deleted: row.deleted ? 1 : 0
      };
      if (!local) s.matches.push(next);
      else if ((row.updated || 0) > (local.updated || 0)) Object.assign(local, next);
    });

    if (payload.settings && payload.settings.updated > (data.settingsUpdated || 0)) {
      try {
        var st = JSON.parse(payload.settings.json);
        if (st.players) data.players = st.players;
        if (st.teams) data.teams = st.teams;
        if (st.versions) data.versions = st.versions;
        if (st.seriesLength) data.seriesLength = st.seriesLength;
        if (st.carry) data.carry = st.carry;
        if (st.carryH2H) data.carryH2H = st.carryH2H;
        data.settingsUpdated = payload.settings.updated;
      } catch (e) { /* leave local settings alone */ }
    }
    normalize(data);
  }

  function parseSc(v) {
    if (Array.isArray(v)) return v;
    try { var a = JSON.parse(v || "[]"); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }

  function setSync(state, msg) {
    sync.state = state;
    sync.msg = msg || "";
    if (state === "ok") sync.at = Date.now();
    render();
  }

  function syncNow(quiet) {
    if (!syncConfigured()) return Promise.resolve();
    if (sync.state === "syncing") return Promise.resolve();
    if (!quiet) setSync("syncing", "");

    var room = encodeURIComponent(data.sync.room);
    var mark = Date.now();
    var out = outboundRows();
    var body = { room: data.sync.room, series: out.series, matches: out.matches };
    var st = settingsBlob();
    if (st.updated) body.settings = st;

    var push = (out.series.length || out.matches.length || body.settings)
      ? fetch(endpoint("/push"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(check)
      : Promise.resolve();

    return push
      .then(function () { data.pushedAt = mark; })
      .then(function () { return fetch(endpoint("/pull?room=" + room)).then(check); })
      .then(function (payload) {
        mergeDown(payload);
        save();
        setSync("ok", "");
      })
      .catch(function (err) {
        setSync("error", err && err.message ? err.message : "Sync failed");
      });
  }

  function check(res) {
    if (!res.ok) {
      return res.text().then(function (t) {
        var msg = "Server said " + res.status;
        try { var j = JSON.parse(t); if (j.error) msg = j.error; } catch (e) {}
        throw new Error(msg);
      });
    }
    return res.json();
  }

  function queueSync() {
    if (!syncConfigured()) return;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(function () { syncNow(true); }, 1500);

  function syncLine() {

      : sync.at ? "Synced " + ago(sync.at)
      : "Waiting to sync";
    var colour = sync.state === "error" ? KITS[2] : "var(--dim)";
    return '<div class="row" style="justify-content:space-between;margin-bottom:12px">' +
      '<span class="tiny" style="color:' + colour + '">' + txt + "</span>" +
      '<button class="tiny" data-sync="1" style="color:var(--muted);font-weight:600">Sync now</button></div>';

  function ago(ts) {
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " hr ago";
    return Math.round(s / 86400) + " days ago";
  }

  // A night is every series played on one date.
  function nightResult(list) {
    var won = {};
    data.players.forEach(function (p) { won[p.id] = 0; });
    var done = 0, drawn = 0;
    list.forEach(function (s) {
      var r = seriesResult(s);
      if (!r.complete) return;
      done++;
      if (r.winner) won[r.winner]++; else drawn++;
    });
    var ranked = data.players.map(function (p) { return { id: p.id, n: won[p.id] }; })
      .sort(function (x, y) { return y.n - x.n; });
    var top = ranked[0];
    var tied = ranked.filter(function (r) { return r.n === top.n; });
    return {
      done: done, drawn: drawn, ranked: ranked,
      winner: top && top.n > 0 && tied.length === 1 ? top.id : null
    };
  }

  function groupByNight(list) {
    var out = [], seen = {};
    list.forEach(function (s) {
      var d = s.date || "";
      if (!seen[d]) { seen[d] = { date: d, list: [] }; out.push(seen[d]); }
      seen[d].list.push(s);
    });
    return out;
  }

  function render() {
    document.getElementById("warn").innerHTML = storageOK ? "" :
      '<div class="warn">This browser isn\u2019t letting the page save. Open it from a web address rather than a downloaded file, and keep private browsing off.</div>';

    document.getElementById("nav").innerHTML = [["now", "Series"], ["table", "Table"], ["player", "Player"], ["history", "History"], ["settings", "Setup"]]
      .map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (ui.tab === t[0] ? "on" : "") + '">' + t[1] + "</button>"; })
      .join("");

    var v = document.getElementById("view");
    v.className = "stack8";

      : ui.tab === "player" ? filterBarHTML(false) + playerHTML()

  /* --------------------------------- actions ------------------------------ */

  function currentSeries() { var a = sx(); return a[a.length - 1]; }
  // True while the last series still has slots free, even if it's been won.
  function hasRoom(s) { return s && mx(s).length < data.seriesLength; }
  function touch(rec) { rec.updated = Date.now(); return rec; }

  function commit() { save(); render(); queueSync(); }

  // Whatever team each player used most recently, across every series.
  function recentTeams() {
    var map = {};
    sx().forEach(function (s) {
      mx(s).forEach(function (m) {
        if (m.ta) map[m.a] = m.ta;
        if (m.tb) map[m.b] = m.tb;
      });
    });
    return map;
  }

  // Teams follow the player, so a rotation still gets the right prefill.
  function applyTeamPrefill() {
    var map = recentTeams();
    ui.ta = ui.picked[0] ? (map[ui.picked[0]] || "") : "";
    ui.tb = ui.picked[1] ? (map[ui.picked[1]] || "") : "";
  }

  // Only carry the players over when the series so far has been the same two
  // every match. If you've been rotating, leave the pick to the user.
  function prefillSheet() {
    var s = currentSeries();
    if (!s) return;
    var live = mx(s);
    if (live.length) {
      var first = [live[0].a, live[0].b].sort().join("|");
      var sameTwo = live.every(function (m) {
        return [m.a, m.b].sort().join("|") === first;
      });
      if (sameTwo) {
        var last = live[live.length - 1];
        ui.picked = [last.a, last.b];
      }
    }
    applyTeamPrefill();
  }

  function resetSheet() {
    ui.picked = []; ui.ga = 0; ui.gb = 0; ui.ta = ""; ui.tb = ""; ui.sa = []; ui.sb = [];
    ui.v = data.lastVersion || (data.versions && data.versions[0]) || "";
  }

  function startSeries() {
    var now = Date.now();
    data.series.push({ id: uid(), created: now, date: ymd(now), updated: now, deleted: 0, matches: [] });
    resetSheet();
    prefillSheet();
    ui.sheet = {};
    commit();
  }

  function addTeam() {
    var name = (ui.newTeam || "").trim();
    if (!name) return;
    var dupe = data.teams.some(function (t) { return t.toLowerCase() === name.toLowerCase(); });
    if (!dupe) data.teams.push(name);
    ui.newTeam = "";
    data.settingsUpdated = Date.now();
    commit();
  }

  // Draws the standings to a canvas so it can go in the group chat as a picture.
  function shareCard() {
    var rows = seasonTable();
    var W = 1080, H = 1080, c = document.createElement("canvas");
    c.width = W; c.height = H;
    var x = c.getContext("2d");

    x.fillStyle = "#0B1523"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#132038"; x.fillRect(60, 60, W - 120, H - 120);
    x.strokeStyle = "#27395B"; x.lineWidth = 2; x.strokeRect(60, 60, W - 120, H - 120);

    var F = "system-ui, -apple-system, 'Segoe UI', sans-serif";
    x.fillStyle = "#EEF2F7";
    x.font = "700 62px " + F;
    x.fillText("FC series log", 110, 175);

    var logged = sx().filter(function (s) { return mx(s).length >= data.seriesLength; }).length;
    x.fillStyle = "#7E93B4"; x.font = "500 30px " + F;
    x.fillText(logged + carryTotal() + " series played", 110, 225);

    var max = Math.max.apply(null, [1].concat(rows.map(function (r) { return r.won; })));
    var y = 330;
    rows.forEach(function (r) {
      x.fillStyle = "#EEF2F7"; x.font = "600 40px " + F;
      x.fillText(r.name, 110, y);
      x.fillStyle = r.kit; x.font = "700 56px " + F;
      x.textAlign = "right";
      x.fillText(String(r.won), W - 110, y + 6);
      x.textAlign = "left";
      x.fillStyle = "#1B2C49";
      roundRect(x, 110, y + 28, W - 220, 18, 9); x.fill();
      x.fillStyle = r.kit;
      roundRect(x, 110, y + 28, Math.max(18, (W - 220) * (r.won / max)), 18, 9); x.fill();
      y += 150;
    });

    var done = sx().filter(function (s) { return mx(s).length >= data.seriesLength; }).slice(-5);
    if (done.length >= 2) {
      x.fillStyle = "#4E6486"; x.font = "500 26px " + F;
      x.fillText("Last " + done.length + " series", 110, H - 165);
      var px = 110;
      done.forEach(function (s) {
        var res = seriesResult(s);
        x.fillStyle = res.winner ? kit(res.winner) : "#4E6486";
        x.beginPath(); x.arc(px + 22, H - 118, 22, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#0B1523"; x.font = "700 24px " + F;
        x.textAlign = "center";
        x.fillText(res.winner ? nameOf(res.winner).charAt(0).toUpperCase() : "D", px + 22, H - 110);
        x.textAlign = "left";
        px += 58;
      });
    }
    return c;
  }

  function roundRect(x, l, t, w, hh, r) {
    x.beginPath();
    x.moveTo(l + r, t);
    x.arcTo(l + w, t, l + w, t + hh, r);
    x.arcTo(l + w, t + hh, l, t + hh, r);
    x.arcTo(l, t + hh, l, t, r);
    x.arcTo(l, t, l + w, t, r);
    x.closePath();
  }

  function shareStandings() {
    var canvas = shareCard();
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var file = new File([blob], "fc-standings.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "FC series log" }).catch(function () {});
        return;
      }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "fc-standings.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, "image/png");
  }

  function exportFile() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fc26-log-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-tab],[data-copy],[data-new],[data-log],[data-edit],[data-pick]," +
      "[data-goal],[data-save],[data-del],[data-close],[data-open],[data-delseries],[data-len]," +
      "[data-export],[data-import]," +
      "[data-addteam],[data-delteam],[data-pair],[data-sync],[data-ver-filter],[data-addver],[data-delver],[data-share],[data-deadrubber],[data-player],[data-invite],[data-selectall]");
    if (!el) return;
    var d = el.dataset;

    if (d.tab) { ui.tab = d.tab; ui.sheet = null; return render(); }

    if (d.copy) {
      var rows = seasonTable();
      var done = sx().filter(function (s) { return mx(s).length >= data.seriesLength; }).length;
      var text = "FC 26 \u2014 after " + done + " series\n" +
        rows.map(function (r, i) { return (i + 1) + ". " + r.name + " \u2014 " + r.won + " series"; }).join("\n");
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () {
        ui.copied = true; render();
        setTimeout(function () { ui.copied = false; render(); }, 1600);
      });
      return;
    }

    if (d.new) return startSeries();

    if (d.log || d.deadrubber) { resetSheet(); prefillSheet(); ui.sheet = {}; return render(); }

    if (d.edit != null) {
      var m = mx(currentSeries())[+d.edit];
      resetSheet();
      if (m) {
        ui.sheet = { editIndex: +d.edit };
        ui.picked = [m.a, m.b]; ui.ga = m.ga; ui.gb = m.gb;
        ui.ta = m.ta || ""; ui.tb = m.tb || "";
        ui.sa = []; ui.sb = [];
        (m.sc || []).forEach(function (g) {
          (g.s === "a" ? ui.sa : ui.sb).push(g.n);
        });
        ui.sa.length = ui.ga; ui.sb.length = ui.gb;
        ui.v = m.v || ui.v;
      } else ui.sheet = {};
      return render();
    }

    if (d.pick) {
      var i = ui.picked.indexOf(d.pick);
      if (i > -1) ui.picked.splice(i, 1);
      else if (ui.picked.length === 2) ui.picked = [ui.picked[1], d.pick];
      else ui.picked.push(d.pick);
      applyTeamPrefill();
      return render();
    }

    if (d.goal) {
      var parts = d.goal.split(":"), which = parts[0] === "0" ? "ga" : "gb";
      ui[which] = Math.max(0, Math.min(99, ui[which] + parseInt(parts[1], 10)));
      var box = which === "ga" ? ui.sa : ui.sb;
      box.length = ui[which]; // trims extra names, leaves blanks when the score goes up
      return render();
    }

    if (d.save) {
      if (ui.picked.length !== 2) return;
      var s = currentSeries(), live = mx(s);
      var sc = [];
      ui.sa.forEach(function (n) { if (n && n.trim()) sc.push({ n: n.trim(), s: "a" }); });
      ui.sb.forEach(function (n) { if (n && n.trim()) sc.push({ n: n.trim(), s: "b" }); });
      var rec = { a: ui.picked[0], b: ui.picked[1], ga: ui.ga, gb: ui.gb, ta: ui.ta, tb: ui.tb, sc: sc, v: ui.v };
      if (ui.sheet && ui.sheet.editIndex != null && live[ui.sheet.editIndex]) {
        Object.assign(touch(live[ui.sheet.editIndex]), rec);
      } else {
        s.matches.push(touch(Object.assign({ id: uid(), ord: live.length, deleted: 0 }, rec)));
      }
      touch(s);
      data.lastVersion = ui.v;
      ui.sheet = null;
      return commit();
    }

    if (d.del) {
      var gone = mx(currentSeries())[ui.sheet.editIndex];
      if (gone) { gone.deleted = 1; touch(gone); }
      ui.sheet = null;
      return commit();
    }

    if (d.close) { ui.sheet = null; return render(); }

    if (d.open) { ui.openSeries = ui.openSeries === d.open ? null : d.open; return render(); }

    if (d.delseries) {
      data.series.forEach(function (s) {
        if (s.id !== d.delseries) return;
        s.deleted = 1; touch(s);
        s.matches.forEach(function (m) { m.deleted = 1; touch(m); });
      });
      return commit();
    }

    if (d.len) { data.seriesLength = +d.len; data.settingsUpdated = Date.now(); return commit(); }

    if (d.pair) { ui.pair = +d.pair; return render(); }

    if (d.player) { ui.player = d.player; return render(); }

    if (el.hasAttribute("data-ver-filter")) { ui.ver = d.verFilter; ui.day = ""; return render(); }

    if (d.sync) return syncNow();

    if (d.share) return shareStandings();

    if (d.invite) return shareInvite();

    if (d.selectall) { try { el.select(); } catch (e) {} return; }

    if (d.addver) {
      var nv = (ui.newVer || "").trim();
      if (nv && !data.versions.some(function (v) { return v.toLowerCase() === nv.toLowerCase(); })) {
        data.versions.push(nv);
      }
      ui.newVer = "";
      data.settingsUpdated = Date.now();
      return commit();
    }
    if (d.delver) {
      if (data.versions.length > 1) {
        data.versions = data.versions.filter(function (v) { return v !== d.delver; });
        if (ui.ver === d.delver) ui.ver = "";
        data.settingsUpdated = Date.now();
      }
      return commit();
    }

    if (d.addteam) return addTeam();

    if (d.delteam) {
      data.teams = data.teams.filter(function (t) { return t !== d.delteam; });
      data.settingsUpdated = Date.now();
      return commit();
    }

    if (d.export) return exportFile();

    if (d.import) return document.getElementById("file").click();
  });

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.name) {
      data.players[idx(el.dataset.name)].name = el.value;
      data.settingsUpdated = Date.now();
      save(); queueSync(); // no re-render, so the field keeps focus
    }
    if (el.id === "newteam") ui.newTeam = el.value; // ditto
    if (el.id === "newver") ui.newVer = el.value; // ditto
    if (el.dataset && el.dataset.scorer) {
      var sp = el.dataset.scorer.split(":");
      (sp[0] === "0" ? ui.sa : ui.sb)[+sp[1]] = el.value; // no re-render, keeps focus
    }
    if (el.id === "syncurl") { data.sync.url = el.value.trim(); save(); }
    if (el.id === "syncroom") { data.sync.room = el.value.trim(); save(); }
    if (el.dataset && el.dataset.cpair) {
      var bits = el.dataset.cpair.split(":"), key = bits[0], who = bits[1];
      var v = parseInt(el.value, 10);
      if (!data.carryH2H) data.carryH2H = {};
      if (!data.carryH2H[key]) data.carryH2H[key] = {};
      data.carryH2H[key][who] = isNaN(v) || v < 0 ? 0 : v;
      data.settingsUpdated = Date.now();
      save(); queueSync(); // no re-render, so the field keeps focus
    }
    if (el.dataset && el.dataset.carry) {
      var n = parseInt(el.value, 10);
      if (!data.carry) data.carry = {};
      data.carry[el.dataset.carry] = isNaN(n) || n < 0 ? 0 : n;
      data.settingsUpdated = Date.now();
      save(); queueSync(); // ditto — standings refresh when you leave this tab
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.id === "newteam" && e.key === "Enter") { e.preventDefault(); addTeam(); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.dataset && e.target.dataset.day) { ui.day = e.target.value; return render(); }
    if (e.target.dataset && e.target.dataset.ver) { ui.v = e.target.value; return; }
    if (e.target.dataset && e.target.dataset.sdate) {
      var sd = data.series.filter(function (s) { return s.id === e.target.dataset.sdate; })[0];
      if (sd) { sd.date = e.target.value; touch(sd); commit(); }
      return;
    }
    if (e.target.dataset && e.target.dataset.team) {
      if (e.target.dataset.team === "0") ui.ta = e.target.value;
      else ui.tb = e.target.value;
      return; // the select already shows the choice, no re-render needed
    }
    if (e.target.id !== "file" || !e.target.files.length) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed.players || !parsed.series) throw new Error("bad file");
        data = normalize(Object.assign({}, DEFAULT, parsed));
        ui.tab = "now";
        commit();
      } catch (err) {
        alert("That file isn't a series log. Pick the fc26-log JSON file you saved earlier.");
      }
    };
    reader.readAsText(e.target.files[0]);
  });

  readInviteLink();
  render();

  if (syncConfigured()) syncNow(true);
  window.addEventListener("online", function () { syncNow(true); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) syncNow(true);
  });
})();
</script>
</body>
</html>
